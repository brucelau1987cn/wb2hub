name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q .
      - run: docker build -t wb2hub:ci .
      - name: Smoke test without accounts
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name wb2hub-ci -e API_KEY=ci-only-not-a-production-key -p 127.0.0.1:17863:7863 wb2hub:ci
          trap 'docker logs wb2hub-ci; docker rm -f wb2hub-ci' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:17863/health > health.json; then
              python -c 'import json; d=json.load(open("health.json")); assert d["ok"] and d["accounts"] == 0'
              exit 0
            fi
            sleep 2
          done
          exit 1
