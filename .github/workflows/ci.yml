name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime and helper from source
        run: docker build -t wb2hub:ci .
      - name: Build credential-free test image
        run: docker build -f Dockerfile.tests -t wb2hub:tests .
      - name: Maintenance regressions without external network
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results/tmp test-results/upstream
          # Only disposable output directories on this isolated runner are shared-writable:
          # container root with all capabilities dropped cannot bypass host UID permissions.
          chmod 0777 test-results/tmp test-results/upstream
          docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 -v "$PWD/test-results:/results" wb2hub:tests python -m unittest discover -s tests -v 2>&1 | tee test-results/maintenance.log
      - name: Audited upstream baseline without external network
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 -v "$PWD/test-results:/results" wb2hub:tests python scripts/run_upstream_tests.py --logs /results/upstream
      - name: Smoke test without accounts or external network
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name wb2hub-ci --network none --cap-drop ALL --security-opt no-new-privileges -e API_KEY=ci-only-not-a-production-key wb2hub:ci
          trap 'docker logs wb2hub-ci > test-results/smoke.log 2>&1; docker rm -fv wb2hub-ci' EXIT
          for i in {1..30}; do
            if docker exec wb2hub-ci python -c 'import json,urllib.request; d=json.load(urllib.request.urlopen("http://127.0.0.1:7863/health",timeout=3)); assert d["ok"] and d["accounts"] == 0'; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
  bridge-cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: tools/wb-tls-bridge/go.sum
      - name: Go module verification and checks
        working-directory: tools/wb-tls-bridge
        run: |
          go mod verify
          go vet ./...
          go test ./...
      - name: Compile Linux amd64 and arm64 helpers
        working-directory: tools/wb-tls-bridge
        run: |
          mkdir -p "$RUNNER_TEMP/bridge"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/bridge/wb-tls-bridge-amd64" .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o "$RUNNER_TEMP/bridge/wb-tls-bridge-arm64" .
